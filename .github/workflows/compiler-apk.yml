name: Compiler l'APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/**'
      - '*.gradle'
      - 'gradle.properties'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Adresse des données chiffrées
        run: |
          echo "window.PAAF_DATA_URL = \"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/donnees/donnees.enc\";" > app/src/main/assets/config.js
          cat app/src/main/assets/config.js

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk PAAF-Clubs-Filles.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PAAF-Clubs-Filles-apk
          path: PAAF-Clubs-Filles.apk
